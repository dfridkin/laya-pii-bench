  Patientennarrativ: Prüfungsteilnehmer ⟦s|2104-0012|coded_id|patient|subject_id|plain⟧

  ⟦s|Jürgen Hoffmeister|phi_direct|patient|person_name|first_last⟧ (geb. ⟦s|07.11.1949|phi_direct|patient|dob|de_dotted⟧), wohnhaft ⟦s|Lindenweg 12, Neuwaldstadt|phi_direct|patient|address|street_city⟧, wurde am ⟦s|12.05.2025|phi_quasi|patient|event_date|de_dotted⟧ in die Studie aufgenommen. Am ⟦s|03.07.2025|phi_quasi|patient|event_date|de_dotted⟧ (Tag 53) entwickelte er eine Pneumonie und wurde stationär im Klinikum Neuwaldstadt aufgenommen.

  Die Prüfärztin, ⟦s|Dr. med. Katrin Albers|staff_pii|staff|person_name|title_first_last⟧, bewertete das Ereignis als schwerwiegend und nicht mit der Prüfmedikation in Zusammenhang stehend. Die Behandlung mit der Prüfmedikation wurde fortgesetzt. ⟦s|Herr Hoffmeister|phi_direct|patient|person_name|title_last⟧ wurde nach neun Tagen entlassen; das Ereignis gilt als abgeklungen.
