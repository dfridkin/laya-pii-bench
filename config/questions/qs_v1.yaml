# qs_v1: four questions, one forward pass. Neutral A/B keys for binary (D-006).
id: qs_v1
questions:
  pii_present:
    type: choice
    instructions: Does this text contain personal identifiers of a real individual (patient or site staff), such as names, contact details, record numbers, birth dates, or study subject numbers?
    criteria:
      A: yes, it contains at least one personal identifier
      B: no, it contains no personal identifiers
  subject_role:
    type: choice
    instructions: Whose personal information appears in this text?
    criteria:
      patient: a trial participant or patient
      staff: investigators, coordinators, monitors, or other site staff
      both: both participants and staff
      none: no individual's personal information
  category:
    type: choice
    instructions: What is the most sensitive kind of personal information in this text?
    criteria:
      direct: direct identifiers such as full names, medical record numbers, phone numbers, emails, addresses, or full birth dates
      quasi: indirect identifiers such as event dates, initials, ages, or postal codes
      coded: coded study identifiers such as subject or randomization numbers
      staff: names or contact details of site staff only
      none: no personal information
  doc_kind:
    type: choice
    instructions: What kind of document text is this?
    criteria:
      narrative: narrative prose describing a case or visit
      form_table: a form, log, or table
      correspondence: a letter or email
      protocol_text: protocol or procedural text
