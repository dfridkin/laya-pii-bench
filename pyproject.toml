[project]
name = "laya-pii-bench"
version = "0.1.0"
description = "Local PII classification benchmark for the Laya decision model on synthetic clinical-trial documents"
requires-python = ">=3.11,<3.14"
dependencies = [
  "laya>=0.3.20",
  "pydantic>=2.8",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "orjson>=3.10",
  "faker>=26",
  "jinja2>=3.1",
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "huggingface-hub>=0.24",
]

[project.scripts]
bench = "bench.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["bench"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "model: needs Laya weights (skipped when LAYA_SKIP_MODEL=1)",
  "slow: long-running",
]
